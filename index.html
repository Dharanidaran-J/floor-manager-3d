<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart-Search Floor Manager</title>
<style>
:root{--bg:#10151f;--card:#1a2233;--line:#2b3650;--tx:#eef1f8;--mut:#8f9bb5;--g:#22c55e;--y:#eab308;--r:#ef4444;--ac:#38bdf8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:1.25rem}h2{margin:0 0 6px}
#clock{font:600 1rem ui-monospace,monospace;color:var(--ac)}
main{max-width:1200px;margin:auto;padding:14px;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select,button{font:inherit;color:var(--tx);background:#0e1420;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
#q{flex:1;min-width:220px}
button{cursor:pointer}button:hover{border-color:var(--ac)}
.btn{background:var(--ac);color:#04121c;font-weight:700;border:0}
.btn.alt{background:#f97316;color:#1b0a00}.btn.gh{background:transparent;color:var(--tx);border:1px solid var(--line)}
.chip{padding:6px 10px;min-height:0;border-radius:99px;font-size:.85rem;color:var(--mut)}
.tabs button{flex:1;min-width:90px}.tabs .on{background:var(--ac);color:#04121c;font-weight:700;border-color:var(--ac)}
.layout{display:grid;grid-template-columns:1fr 340px;gap:14px}
@media(max-width:860px){.layout{grid-template-columns:1fr}}
.free{--c:#22c55e;background:var(--c)}.soon{--c:#eab308;background:var(--c);color:#111}
.busy{--c:#ef4444;background:var(--c)}.closed{--c:#64748b;background:var(--c)}
.stage{perspective:1800px;height:min(78vw,560px);position:relative;overflow:hidden;cursor:grab;touch-action:none;user-select:none;border-radius:12px;background:radial-gradient(circle at 50% 30%,#1d2a48,#0b0f18)}
.stage.drag{cursor:grabbing}
.scale{position:absolute;left:50%;top:54%;width:0;height:0;transform-style:preserve-3d}
.bld{position:absolute;width:0;height:0;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,.7,.2,1)}
.drag .bld{transition:none}
.fl{position:absolute;left:0;top:0;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,.7,.2,1)}
.slab{position:absolute;left:-390px;top:-170px;width:780px;height:340px;background:#22305a;border:2px solid #4a5d94;border-radius:8px;transform:translateZ(-4px);background-image:linear-gradient(#0000 0 calc(50% - 30px),#33437a calc(50% - 30px) calc(50% + 30px),#0000 calc(50% + 30px))}
.fname{position:absolute;left:-380px;top:152px;font:700 14px system-ui;color:#9fb0d8;transform:translateZ(1px) rotateZ(calc(-1 * var(--rz)));transform-origin:0 0;white-space:nowrap}
.fl:not(.cur) .slab,.fl:not(.cur) .face{opacity:.3}
.flat .fl:not(.cur){display:none}
.room,.com{position:absolute;transform-style:preserve-3d;transition:transform .3s}
.room{cursor:pointer}.room:hover{transform:translateZ(10px)}.room.sel{transform:translateZ(18px)}
.face{position:absolute;left:0;top:0;background:var(--c);transform-origin:0 0;border:1px solid #0005;transition:background .5s,opacity .5s}
.com{--c:#3a4a78}
.s1{filter:brightness(.78)}.s2{filter:brightness(.6)}
.t{display:flex;align-items:center;justify-content:center}
.lbl{font:700 17px system-ui;color:#fff;text-align:center;line-height:1.2;text-shadow:0 1px 3px #0009;transform:rotateZ(calc(-1 * var(--rz)))}
.soon .lbl{color:#111;text-shadow:none}
.lbl small{display:block;font-weight:500;font-size:12px}
.room.dim .face{opacity:.15}
.room.sel .t{box-shadow:inset 0 0 0 5px #fff,0 0 26px 8px #fff9}
.room.sel .lbl::after,.room.match .lbl::after{content:"\2B50";position:absolute;top:3px;right:6px;font-size:18px}
.room.match .t{animation:pulse 1.1s infinite}.room.claimed .lbl::before{content:"\2713 "}
@keyframes pulse{50%{filter:brightness(1.5)}}
.hint{color:var(--mut);font-size:.8rem;margin:6px 2px 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--mut);font-size:.9rem}
.pill{display:inline-block;padding:3px 12px;border-radius:99px;font-weight:700;font-size:.85rem;margin-bottom:8px}
.pill.free{color:#fff}.pill.soon{color:#111}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0}dt{color:var(--mut)}dd{margin:0}
.cd{margin:12px 0;padding:12px;border-radius:12px;background:#0e1420;text-align:center;border:2px solid var(--line);transition:border-color .3s}
.cd b{display:block;font:700 2.2rem ui-monospace,monospace;letter-spacing:.05em}
.cd.g{border-color:var(--g)}.cd.g b{color:var(--g)}.cd.y{border-color:var(--y)}.cd.y b{color:var(--y)}.cd.r{border-color:var(--r)}.cd.r b{color:var(--r);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.55}}
.panel .btn{width:100%;margin-top:8px}
.ok{padding:10px;border-radius:10px;background:#14532d;text-align:center}
.best{border:2px solid var(--g)}
.best .cd{display:inline-block;padding:6px 14px;margin:6px 0}.best .cd b{font-size:1.4rem}
.mut{color:var(--mut)}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#modal.open{display:flex}#modal>div{background:var(--card);border-radius:16px;padding:20px;max-width:420px;width:100%;animation:in2 .25s}
@keyframes in2{from{transform:scale(.92);opacity:0}}
.msg{background:#0e1420;border-radius:10px;padding:10px;margin:10px 0}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--g);color:#04210f;font-weight:700;padding:10px 18px;border-radius:99px;display:none;z-index:10}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><h1>🏢 Smart-Search Floor Manager</h1><span id="clock"></span></header>
<main>
<section class="card">
  <div class="row"><input id="q" placeholder="e.g. I need an AC room on the ground floor for 2 hours"><button class="btn" id="go">Find room</button></div>
  <div class="row" style="margin-top:8px">
    <button class="chip" data-ex="AC room on the ground floor for 2 hours">AC room, ground floor, 2 hours</button>
    <button class="chip" data-ex="room for 30 students on 2nd floor for 1 hour">30 students, 2nd floor, 1 hour</button>
    <button class="chip" data-ex="non ac room for 45 minutes">Non-AC, 45 minutes</button>
  </div>
  <div id="result" style="margin-top:10px"></div>
</section>

<section class="card row" aria-label="Filters">
  <b>Filters</b>
  <select id="fAc"><option value="any">AC: any</option><option value="ac">AC only</option><option value="non">Non-AC only</option></select>
  <input id="fCap" type="number" min="0" placeholder="Min capacity" style="width:140px">
  <label class="row"><input id="fFree" type="checkbox" style="min-height:0"> Available only</label>
</section>

<div class="row tabs" id="tabs"></div>

<div class="layout">
  <section class="card">
    <div class="row" style="justify-content:space-between"><div class="legend">
      <span>🟢 Available</span><span>🟡 Available Soon (class ends ≤15 min)</span><span>🔴 Occupied</span><span>⭐ Selected / match</span></div>
      <div class="row"><button class="chip" id="view">2D / 3D</button><button class="chip" id="reset">Reset view</button></div></div>
    <div class="stage" id="stage"><div class="scale" id="scale"><div class="bld" id="bld"></div></div></div>
    <p class="hint">Drag to rotate the building. Click a room to select it.</p>
  </section>
  <aside class="card panel" id="panel"></aside>
</div>

<section class="card row">
  <b>🎬 Demo Time</b>
  <input type="time" id="demoT" value="13:05">
  <button class="btn" id="demoGo">Apply Demo Time</button>
  <button class="btn gh" id="demoOff">Use Current Time</button>
</section>
</main>
<div id="modal"><div id="mbox"></div></div><div id="toast"></div>

<script>
/* ---------- DATA: timetable is the single source of truth ---------- */
const FLOORS=["Ground","1st Floor","2nd Floor","3rd Floor"];
const SUBJ=["Machine Learning","Data Structures","Operating Systems","DBMS","Computer Networks","Discrete Maths","Web Technology","Software Engineering","AI Fundamentals","Cyber Security"];
const START=9*3600, CLOSE=18*3600;
const hash=n=>{n=Math.imul(n^n>>>15,2246822507);n=Math.imul(n^n>>>13,3266489909);return(n^n>>>16)>>>0};
const ROOMS=[],TT={};
FLOORS.forEach((_,fl)=>{for(let i=0;i<8;i++){
  const id=fl?`IST ${fl}0${i+1}`:`G0${i+1}`,seed=fl*8+i+1,h=hash(seed);
  ROOMS.push({id,fl,cap:[20,30,40,60][h%4],ac:h%3!==0});
  TT[id]=[];
  for(let hr=9;hr<18;hr++){const k=hash(seed*97+hr); if(k%100<52)TT[id].push({s:hr*3600,e:(hr+1)*3600,c:SUBJ[k%SUBJ.length]})}
}});

/* ---------- TIME ---------- */
let demo=null;
function nowSec(){
  if(demo)return Math.floor(demo.base+(Date.now()-demo.at)/1000)%86400;
  const d=new Date();return d.getHours()*3600+d.getMinutes()*60+d.getSeconds();
}
function fmt(s,sec){s=Math.floor(s);let h=Math.floor(s/3600)%24,m=Math.floor(s%3600/60);const ap=h>=12?"PM":"AM";h=h%12||12;
  return `${h}:${String(m).padStart(2,"0")}${sec?":"+String(s%60).padStart(2,"0"):""} ${ap}`}
const calculateCountdown=s=>{s=Math.max(0,Math.floor(s));return[s/3600|0,s%3600/60|0,s%60].map(n=>String(n).padStart(2,"0")).join(":")};

/* ---------- ROOM LOGIC ---------- */
const getCurrentClass=(id,t)=>TT[id].find(c=>c.s<=t&&t<c.e);
const getNextClass=(id,t)=>TT[id].find(c=>c.s>t);
function busyUntil(id,t){let c=getCurrentClass(id,t);if(!c)return t;let e=c.e;while((c=TT[id].find(x=>x.s===e)))e=c.e;return e}
function getRoomStatus(id,t){
  if(t>=CLOSE)return"closed";
  if(getCurrentClass(id,t))return busyUntil(id,t)-t<=900?"soon":"busy";
  return"free";
}
const getAvailableUntil=(id,t)=>{const n=getNextClass(id,t);return n?n.s:CLOSE};
function getRemainingTime(id,t){ // seconds until the room's state changes
  const s=getRoomStatus(id,t);
  if(s==="free")return getAvailableUntil(id,t)-t;
  if(s==="closed")return 0;
  return busyUntil(id,t)-t;
}
function cdClass(id,t){
  if(getRoomStatus(id,t)!=="free")return"n";
  const r=getRemainingTime(id,t);return r>1800?"g":r>600?"y":"r";
}

/* ---------- STATE ---------- */
const $=s=>document.querySelector(s);
let floor=0,sel=null,best=null,matches=new Set(),flat=false,lastQuery="",lastSig="",claimed={};
try{claimed=JSON.parse(localStorage.getItem("claimed")||"{}")}catch(e){}
const byId=id=>ROOMS.find(r=>r.id===id);
const save=()=>{try{localStorage.setItem("claimed",JSON.stringify(claimed))}catch(e){}};

/* ---------- MAP ---------- */
function buildTabs(){
  $("#tabs").innerHTML=FLOORS.map((f,i)=>`<button data-f="${i}" class="${i===floor?"on":""}">${f}</button>`).join("");
  document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>setFloor(+b.dataset.f));
}
let rx=58,rz=-28,moved=false;const GAP=95,RH=46;
function box(w,d,h,inner){
  const f=(c,st)=>`<div class="face ${c}" style="${st}"></div>`;
  return `<div class="face t" style="width:${w}px;height:${d}px;transform:translateZ(${h}px)">${inner}</div>`
   +f("s1",`width:${w}px;height:${h}px;transform:rotateX(90deg)`)
   +f("s1",`width:${w}px;height:${h}px;transform:translateY(${d}px) rotateX(90deg)`)
   +f("s2",`width:${h}px;height:${d}px;transform:rotateY(-90deg)`)
   +f("s2",`width:${h}px;height:${d}px;transform:translateX(${w}px) rotateY(-90deg)`);
}
function buildMap(){
  let h="";
  FLOORS.forEach((f,i)=>{
    h+=`<div class="fl" data-fl="${i}"><div class="slab"></div><div class="fname">${f}</div>`;
    ROOMS.filter(r=>r.fl===i).forEach((r,k)=>{
      h+=`<div class="room" data-id="${r.id}" style="left:${-380+(k%4)*160}px;top:${k<4?-150:30}px">${box(150,120,RH,`<div class="lbl">${r.id}<small>${r.cap} \u{1F465}${r.ac?" \u2744\uFE0F":""}</small></div>`)}</div>`;
    });
    h+=`<div class="com" style="left:270px;top:-150px">${box(110,300,22,`<div class="lbl"><small>${i?"\u{1F6D7} Lift<br>\u{1FA9C} Stairs<br>\u{1F6BB} Washrooms":"\u{1F6AA} Entrance<br>\u{1F6CE}\uFE0F Reception<br>\u{1F6D7} Lift"}</small></div>`)}</div></div>`;
  });
  $("#bld").innerHTML=h;
  document.querySelectorAll(".room").forEach(el=>el.onclick=()=>{if(!moved)highlightRoomOnMap(el.dataset.id)});
  place();paint();
}
function setFloor(f){floor=f;buildTabs();place()}
function place(){
  const b=$("#bld"),X=flat?0:rx,Z=flat?0:rz;
  b.style.setProperty("--rz",Z+"deg");
  b.style.transform=`rotateX(${X}deg) rotateZ(${Z}deg) translateZ(${-floor*GAP-30}px)`;
  b.querySelectorAll(".fl").forEach(el=>{const i=+el.dataset.fl;
    el.classList.toggle("cur",i===floor);
    el.style.transform=`translateZ(${i*GAP+(i>floor?100:0)}px)`});
  $("#stage").classList.toggle("flat",flat);fit();
}
function fit(){$("#scale").style.transform=`scale(${Math.min(1.25,Math.max(.4,$("#stage").clientWidth/980))})`}
window.addEventListener("resize",fit);
(()=>{const st=$("#stage");let d=null;
  st.onpointerdown=e=>{d={x:e.clientX,y:e.clientY,rx,rz};moved=false};
  st.onpointermove=e=>{if(!d)return;const dx=e.clientX-d.x,dy=e.clientY-d.y;
    if(!moved&&Math.abs(dx)+Math.abs(dy)>6){moved=true;flat=false;st.classList.add("drag");st.setPointerCapture(e.pointerId)}
    if(moved){rz=d.rz+dx*.4;rx=Math.max(15,Math.min(80,d.rx-dy*.3));place()}};
  st.onpointerup=st.onpointercancel=()=>{d=null;st.classList.remove("drag");setTimeout(()=>moved=false,0)};
})();
function passes(r,s){
  const ac=$("#fAc").value,cap=+$("#fCap").value||0;
  return !(ac==="ac"&&!r.ac)&&!(ac==="non"&&r.ac)&&r.cap>=cap&&!($("#fFree").checked&&s!=="free");
}
function paint(){
  const t=nowSec();
  document.querySelectorAll(".room").forEach(b=>{
    const r=byId(b.dataset.id),s=getRoomStatus(r.id,t);
    b.className=`room ${s}`+(sel===r.id?" sel":"")+(matches.has(r.id)?" match":"")+(claimed[r.id]?" claimed":"")+(passes(r,s)?"":" dim");
    b.setAttribute("aria-label",`${r.id} ${s}`);
  });
}
function highlightRoomOnMap(id){const r=byId(id);if(r.fl!==floor)setFloor(r.fl);select(id)}

/* ---------- ROOM PANEL ---------- */
function select(id){sel=id;renderPanel();paint()}
function renderPanel(){
  const el=$("#panel");
  if(!sel){el.innerHTML=`<h2>Room details</h2><p class="mut">Tap a room on the map to see availability, a live countdown, and to claim it.</p>`;return}
  const t=nowSec(),r=byId(sel),s=getRoomStatus(sel,t),cur=getCurrentClass(sel,t),nx=getNextClass(sel,t),free=s==="free";
  const label={free:"🟢 AVAILABLE",soon:"🟡 AVAILABLE SOON",busy:"🔴 OCCUPIED",closed:"⚫ CLOSED"}[s];
  el.innerHTML=`<h2>${r.id}</h2><div class="pill ${s}">${label}</div>
  <dl><dt>Floor</dt><dd>${FLOORS[r.fl]}</dd><dt>Capacity</dt><dd>${r.cap} students</dd><dt>AC</dt><dd>${r.ac?"Yes":"No"}</dd>
  ${cur?`<dt>Now</dt><dd>${cur.c}, until ${fmt(busyUntil(sel,t))}</dd>`:free?`<dt>Free until</dt><dd>${fmt(getAvailableUntil(sel,t))}</dd>`:""}
  <dt>Next class</dt><dd>${nx?`${fmt(nx.s)} – ${fmt(nx.e)}<br>${nx.c}`:"None today"}</dd></dl>
  <div class="cd"><span>${free?(nx?"Next class starts in":"Building closes in"):"Room frees up in"}</span><b data-cd="${sel}"></b></div>
  ${claimed[sel]?`<div class="ok">⭐ Claimed by You${free?`<br><small>Available until ${fmt(getAvailableUntil(sel,t))}</small>`:""}</div>`:free?`<button class="btn" onclick="askClaim('${sel}')">Claim Room</button>`:""}
  ${free||claimed[sel]?`<button class="btn alt" onclick="squad('${sel}')">📣 Call the Squad</button>`:""}`;
  tickCountdowns();
}

/* ---------- CLAIM ---------- */
function openModal(h){$("#mbox").innerHTML=h;$("#modal").classList.add("open")}
function closeModal(){$("#modal").classList.remove("open")}
$("#modal").onclick=e=>{if(e.target.id==="modal")closeModal()};
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t.h);t.h=setTimeout(()=>t.style.display="none",1800)}
function askClaim(id){
  openModal(`<h2>Claim ${id}?</h2><p>You are about to claim <b>${id}</b>.<br>This room is available until <b>${fmt(getAvailableUntil(id,nowSec()))}</b>.</p>
  <div class="row"><button class="btn" onclick="claimRoom('${id}')">Confirm</button><button class="btn gh" onclick="closeModal()">Cancel</button></div>`);
}
function claimRoom(id){ // does NOT touch the timetable
  claimed[id]=true;save();closeModal();toast("✓ Room Claimed");renderPanel();renderBest();paint();
}

/* ---------- SQUAD + WHATSAPP ---------- */
function generateWhatsAppMessage(id){return`📍 Heading to ${id}. It's free until ${fmt(getAvailableUntil(id,nowSec()))}. Come fast!`}
function squad(id){
  const msg=generateWhatsAppMessage(id);
  openModal(`<h2>📣 CALL THE SQUAD</h2><p><b>${id}</b><br>Free until ${fmt(getAvailableUntil(id,nowSec()))}</p>
  <div class="msg">${msg}</div>
  <div class="row"><button class="btn" onclick="shareRoom('${id}','wa')">📱 Share on WhatsApp</button>
  <button class="btn gh" onclick="shareRoom('${id}','copy')">📋 Copy Message</button></div>
  <p id="inv" class="mut"></p><button class="btn gh" onclick="closeModal()" style="width:100%">Close</button>`);
}
async function shareRoom(id,how){
  const msg=generateWhatsAppMessage(id);
  if(how==="wa")window.open("https://wa.me/?text="+encodeURIComponent(msg),"_blank");
  else{try{await navigator.clipboard.writeText(msg)}catch(e){const a=document.createElement("textarea");a.value=msg;document.body.append(a);a.select();document.execCommand("copy");a.remove()}}
  $("#inv").textContent="✓ Invite Ready";
}

/* ---------- AI ROOM FINDER (natural-language parser) ---------- */
function parseQuery(q){
  q=q.toLowerCase();const o={};
  if(/ground|\bg\b|floor 0/.test(q))o.floor=0;
  else{const m=q.match(/\b([1-3])(?:st|nd|rd)?\s*floor|floor\s*([1-3])|\b(first|second|third)\b/);
    if(m)o.floor=m[1]?+m[1]:m[2]?+m[2]:{first:1,second:2,third:3}[m[3]]}
  if(/non[- ]?ac|no ac|without ac/.test(q))o.ac=false;else if(/\bac\b|air[- ]?condition|cool/.test(q))o.ac=true;
  let m=q.match(/(\d+)\s*(?:people|students|persons|seats|members|pax|friends)/)||q.match(/(?:capacity|seat|fit)\D{0,8}(\d+)/);
  if(m)o.cap=+m[1];
  let d=0;m=q.match(/(\d+(?:\.\d+)?)\s*(?:hours?|hrs?|h)\b/);if(m)d+=parseFloat(m[1])*60;
  m=q.match(/(\d+)\s*(?:minutes?|mins?)\b/);if(m)d+=+m[1];
  if(d)o.dur=d;return o;
}
function runSearch(q){
  lastQuery=q;const c=parseQuery(q),t=nowSec();
  const list=ROOMS.filter(r=>getRoomStatus(r.id,t)==="free"
    &&(c.floor===undefined||r.fl===c.floor)&&(c.ac===undefined||r.ac===c.ac)&&(!c.cap||r.cap>=c.cap)
    &&(!c.dur||getRemainingTime(r.id,t)>=c.dur*60))
    .sort((a,b)=>getRemainingTime(b.id,t)-getRemainingTime(a.id,t)||a.cap-b.cap);
  matches=new Set(list.map(r=>r.id));best=list[0]?.id||null;
  const tags=[c.floor!==undefined&&FLOORS[c.floor],c.ac!==undefined&&(c.ac?"AC":"Non-AC"),c.cap&&`${c.cap}+ seats`,c.dur&&`${c.dur} min`].filter(Boolean).join(" • ");
  $("#result").dataset.tags=tags||"no specific requirements";
  if(best){const b=byId(best);if(c.floor!==undefined||b.fl!==floor)setFloor(b.fl);}
  renderBest();paint();
}
function renderBest(){
  const el=$("#result");if(!lastQuery){el.innerHTML="";return}
  const tags=el.dataset.tags;
  if(!best){el.innerHTML=`<p>No available room matches (${tags}). Try a shorter duration or another floor.</p>`;return}
  const t=nowSec(),r=byId(best);
  el.innerHTML=`<p class="mut">Understood: ${tags}</p><p><b>${matches.size} room${matches.size>1?"s":""} match.</b> ${[...matches].slice(0,8).map(id=>`<button class="chip" onclick="highlightRoomOnMap('${id}')">${id} ⭐</button>`).join("")}</p>
  <div class="card best"><b>Best match: ${r.id}</b><br>🟢 Available<br>${r.ac?"AC":"Non-AC"} • Capacity ${r.cap}<br>Free until <b>${fmt(getAvailableUntil(best,t))}</b>
  <div class="cd">⏳ <b data-cd="${best}"></b> remaining</div>
  <div class="row"><button class="btn" onclick="highlightRoomOnMap('${best}')">View on Map</button>
  ${claimed[best]?`<span class="ok" style="padding:8px 12px">⭐ Claimed</span>`:`<button class="btn gh" onclick="askClaim('${best}')">Claim Room</button>`}
  <button class="btn alt" onclick="squad('${best}')">📣 Call the Squad</button></div></div>`;
  tickCountdowns();
}

/* ---------- LIVE TICK (single interval, one source of time) ---------- */
function tickCountdowns(){
  const t=nowSec();
  document.querySelectorAll("[data-cd]").forEach(e=>{
    const id=e.dataset.cd;e.textContent=calculateCountdown(getRemainingTime(id,t));
    const c=cdClass(id,t);e.parentElement.classList.remove("g","y","r","n");if(c!=="n")e.parentElement.classList.add(c);
    e.dataset.warn=c==="g"?"🟢":c==="y"?"🟡":c==="r"?"🔴":"";
  });
}
function tick(){
  const t=nowSec();$("#clock").textContent=(demo?"DEMO ":"LIVE ")+fmt(t,true);
  const sig=[sel,best].map(id=>id?getRoomStatus(id,t):"-").join("|");
  paint();
  if(sig!==lastSig){lastSig=sig;renderPanel();renderBest()} // room flipped to occupied etc.
  tickCountdowns();
}
setInterval(tick,1000);

/* ---------- WIRING ---------- */
$("#go").onclick=()=>{const q=$("#q").value.trim();if(q)runSearch(q)};
$("#q").onkeydown=e=>{if(e.key==="Enter")$("#go").click()};
document.querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>{$("#q").value=b.dataset.ex;runSearch(b.dataset.ex)});
["fAc","fCap","fFree"].forEach(i=>$("#"+i).oninput=paint);
$("#view").onclick=()=>{flat=!flat;place()};
$("#reset").onclick=()=>{flat=false;rx=58;rz=-28;place()};
function applyDemo(){
  const [h,m]=$("#demoT").value.split(":").map(Number);
  demo={base:h*3600+m*60,at:Date.now()};afterTimeChange();
}
function afterTimeChange(){if(lastQuery)runSearch(lastQuery);renderPanel();renderBest();paint();tick()}
$("#demoGo").onclick=applyDemo;
$("#demoOff").onclick=()=>{demo=null;afterTimeChange()};

buildTabs();buildMap();renderPanel();tick();
</script></body></html>
